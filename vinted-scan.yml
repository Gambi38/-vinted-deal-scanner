name: Vinted API rapide

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: vinted-api-rapide
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conditions.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r conditions.txt

      - name: Restaurer le dernier etat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime_data
          artifact_id="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"

          if [ -n "$artifact_id" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o /tmp/vinted-state.zip
            unzip -oq /tmp/vinted-state.zip -d runtime_data
          fi

          test -f runtime_data/annonces_vues.json || printf '[]\n' > runtime_data/annonces_vues.json

      - name: Mettre a jour les references PriceCharting
        env:
          PRICECHARTING_CSV_URL: ${{ secrets.PRICECHARTING_CSV_URL }}
        run: |
          python pricecharting_catalog.py \
            --output runtime_data/pricecharting_catalog.json \
            --max-age-hours 24 \
            --min-sales-volume 3 \
            --usd-to-eur 0.85 \
            --resale-haircut 0.80 \
            --max-buy-ratio 0.45 \
            --allow-missing

      - name: Mettre a jour les appareils et outils
        env:
          DEVICE_CATALOG_CSV_URL: ${{ secrets.DEVICE_CATALOG_CSV_URL }}
        run: |
          python universal_catalog.py \
            --input appareils_cibles.csv \
            --output runtime_data/device_catalog.json \
            --max-age-hours 24 \
            --min-demand 4 \
            --allow-missing

      - name: Verifier le bot
        run: |
          python -m py_compile vinted_api_light.py product_classifier.py photo_condition.py scanner_runtime.py search_cache.py sold_listings.py monitoring.py pricecharting_catalog.py universal_catalog.py
          python -m unittest -v test_api_light.py test_product_classifier.py test_photo_condition.py test_pricecharting_catalog.py test_electronics_catalog.py test_universal_catalog.py
          python -m json.tool config.json > /dev/null
          python -m json.tool blacklist.json > /dev/null
          python -m json.tool filtres.json > /dev/null
          python -m json.tool produits_cibles.json > /dev/null
          python -m json.tool consoles_cibles.json > /dev/null
          python -m json.tool electroniques_cibles.json > /dev/null
          test -s appareils_cibles.csv

      - name: Tester NTFY au lancement manuel
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -fsS --max-time 10 \
            -H "Title: Vinted API" \
            -H "Priority: high" \
            -d "Test notification OK. Le scanner Vinted démarre." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Scanner Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: "https://ntfy.sh"
          VINTED_DATA_DIR: "runtime_data"
          VINTED_LOG_LEVEL: "INFO"
        run: python -u vinted_api_light.py

      - name: Sauvegarder le meme etat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinted-state
          path: runtime_data/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Nettoyer les anciens etats
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifact_ids < <(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[3:] | .[].id')
          for artifact_id in "${artifact_ids[@]}"; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

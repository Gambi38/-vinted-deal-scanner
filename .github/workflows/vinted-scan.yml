name: Vinted Tarayici

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: vinted-tarayici
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conditions.txt

      - name: Installer
        run: |
          pip install -r conditions.txt
          python -m playwright install --with-deps chromium

      - name: Preparer
        run: |
          if [ ! -f annonces_vues.json ]; then
            if [ -f seen.json ]; then cp seen.json annonces_vues.json; else echo '[]' > annonces_vues.json; fi
          fi

          if [ ! -f alertes.csv ] && [ -f alerts.csv ]; then
            cp alerts.csv alertes.csv
          fi

          python -m py_compile vinted_tarayici.py fusion_donnees.py
          python -m json.tool config.json > /dev/null
          python -m json.tool blacklist.json > /dev/null
          python -m json.tool filtres.json > /dev/null
          test -f exemples.txt

      - name: Notification test
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -fsS \
            -H "Title: Vinted Tarayici" \
            -H "Priority: high" \
            -d "Vinted Tarayici demarre correctement." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Scanner Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          HEADLESS: "1"
        run: python -u vinted_tarayici.py --once --headless

      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "vinted-tarayici-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test -f annonces_vues.json || echo '[]' > annonces_vues.json
          cp annonces_vues.json /tmp/vues.json

          if [ -f alertes.csv ]; then
            cp alertes.csv /tmp/alertes.csv
          else
            : > /tmp/alertes.csv
          fi

          git fetch origin main
          git reset --hard origin/main

          if [ ! -f annonces_vues.json ]; then
            if [ -f seen.json ]; then cp seen.json annonces_vues.json; else echo '[]' > annonces_vues.json; fi
          fi

          python fusion_donnees.py \
            /tmp/vues.json \
            /tmp/alertes.csv \
            annonces_vues.json \
            alertes.csv

          git add annonces_vues.json
          [ ! -f alertes.csv ] || git add alertes.csv

          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour du scanner [skip ci]"
            git push origin HEAD:main
          fi

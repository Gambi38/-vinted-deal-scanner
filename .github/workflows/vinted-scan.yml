name: Scanner Vinted

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: vinted-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Vérifier le scanner
        run: |
          python -m py_compile vinted_scraper.py merge_state.py
          python -m json.tool config.json > /dev/null
          python -m json.tool blacklist.json > /dev/null

      - name: Tester les notifications
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -fsS \
            -H "Title: Scanner Vinted" \
            -H "Priority: high" \
            -d "Scanner Vinted demarre correctement." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Scanner Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: "https://ntfy.sh"
          HEADLESS: "1"
        run: |
          python -u vinted_scraper.py --once --headless

      - name: Sauvegarder les résultats
        if: always()
        run: |
          git config user.name "vinted-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp seen.json /tmp/seen-local.json
          cp alerts.csv /tmp/alerts-local.csv

          saved=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python merge_state.py \
              /tmp/seen-local.json \
              /tmp/alerts-local.csv \
              seen.json \
              alerts.csv

            git add seen.json alerts.csv

            if git diff --cached --quiet; then
              saved=1
              break
            fi

            git commit -m "Mise a jour du scanner [skip ci]"

            if git push origin HEAD:main; then
              saved=1
              break
            fi

            sleep 2
          done

          test "$saved" = "1"

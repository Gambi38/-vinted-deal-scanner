name: Vinted Tarayici

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: vinted-tarayici
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conditions.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r conditions.txt
          python -m playwright install --with-deps chromium

      - name: Restaurer l'etat du dernier scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime_data

          artifact_id="$(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty'
          )"

          if [ -n "$artifact_id" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o /tmp/vinted-state.zip
            unzip -oq /tmp/vinted-state.zip -d runtime_data
          fi

          if [ ! -f runtime_data/annonces_vues.json ]; then
            if [ -f annonces_vues.json ]; then
              cp annonces_vues.json runtime_data/annonces_vues.json
            elif [ -f seen.json ]; then
              cp seen.json runtime_data/annonces_vues.json
            fi
          fi

          if [ ! -f runtime_data/alertes.csv ]; then
            if [ -f alertes.csv ]; then
              cp alertes.csv runtime_data/alertes.csv
            elif [ -f alerts.csv ]; then
              cp alerts.csv runtime_data/alertes.csv
            fi
          fi

          test -f runtime_data/annonces_vues.json || printf '[]\n' > runtime_data/annonces_vues.json

          if [ ! -f runtime_data/alertes.csv ]; then
            printf 'timestamp,category,search,brand,model,size,opportunity_score,title,published_at,age_minutes,image_url,listing_price,total_buy_est,resale_low,resale_high,margin_low,margin_high,roi_low,demand_score,risk,reason,url,item_id\n' > runtime_data/alertes.csv
          fi

      - name: Verifier les fichiers
        run: |
          python -m py_compile vinted_tarayici.py fusion_donnees.py
          if [ -f test_bot.py ]; then
            python -m unittest -v test_bot.py
          fi
          python -m json.tool config.json > /dev/null
          python -m json.tool blacklist.json > /dev/null
          python -m json.tool filtres.json > /dev/null
          test -f exemples.txt
          test -f .env.example
          test -f .gitignore

      - name: Tester les notifications
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -fsS \
            -H "Title: Vinted Tarayici" \
            -H "Priority: high" \
            -d "Vinted Tarayici demarre correctement." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Scanner Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: "https://ntfy.sh"
          VINTED_DATA_DIR: "runtime_data"
          VINTED_LOG_LEVEL: "INFO"
          VINTED_REQUEST_DELAY_MIN_SECONDS: "1.0"
          VINTED_REQUEST_DELAY_MAX_SECONDS: "3.0"
          VINTED_STARTUP_JITTER_MAX_SECONDS: "20"
          HEADLESS: "1"
        run: |
          python -u vinted_tarayici.py --once --headless

      - name: Sauvegarder l'etat hors du depot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinted-state
          path: runtime_data/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Nettoyer les anciens etats
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifact_ids < <(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[3:] | .[].id'
          )

          for artifact_id in "${artifact_ids[@]}"; do
            [ -n "$artifact_id" ] || continue
            gh api \
              --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

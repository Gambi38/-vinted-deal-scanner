name: Vinted API rapide

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: vinted-api-rapide
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conditions.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r conditions.txt

      - name: Restaurer le dernier etat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime_data
          artifact_id="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"

          if [ -n "$artifact_id" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o /tmp/vinted-state.zip
            unzip -oq /tmp/vinted-state.zip -d runtime_data
          fi

          test -f runtime_data/annonces_vues.json || printf '[]\n' > runtime_data/annonces_vues.json
          test -f runtime_data/annonces_prix.json || printf '{}\n' > runtime_data/annonces_prix.json

      - name: Verifier le bot
        run: |
          python -m py_compile vinted_api_light.py fusion_donnees.py
          python -m unittest -v test_api_light.py
          python -m json.tool config.json > /dev/null
          python -m json.tool blacklist.json > /dev/null
          python -m json.tool filtres.json > /dev/null

      - name: Scanner Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: "https://ntfy.sh"
          VINTED_DATA_DIR: "runtime_data"
          VINTED_LOG_LEVEL: "INFO"
          VINTED_REJECT_UNKNOWN_LISTING_AGE: "true"
          VINTED_UNKNOWN_AGE_MAX_ATTEMPTS: "2"
          VINTED_EXCLUDE_PRO_SELLERS: "true"
          VINTED_REQUEST_DELAY_MIN_SECONDS: "1.0"
          VINTED_REQUEST_DELAY_MAX_SECONDS: "3.0"
          VINTED_BACKOFF_MAX_SECONDS: "60"
        run: python -u vinted_api_light.py

      - name: Sauvegarder le meme etat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinted-state
          path: runtime_data/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Nettoyer les anciens etats
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifact_ids < <(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[3:] | .[].id')
          for artifact_id in "${artifact_ids[@]}"; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

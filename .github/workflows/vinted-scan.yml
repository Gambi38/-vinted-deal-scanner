name: Vinted Deal Scanner

"on":
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -X POST \
            -H "Title: Scanner Vinted" \
            -d "Test notification OK" \
            "https://ntfy.sh/$NTFY_TOPIC"

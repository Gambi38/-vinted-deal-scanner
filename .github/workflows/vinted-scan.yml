name: Vinted Tarayici

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: vinted-tarayici
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conditions.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r conditions.txt
          python -m playwright install --with-deps chromium

      - name: Recuperer les anciens resultats si necessaire
        run: |
          if [ ! -f annonces_vues.json ] && [ -f seen.json ]; then
            cp seen.json annonces_vues.json
          fi

          if [ ! -f alertes.csv ] && [ -f alerts.csv ]; then
            cp alerts.csv alertes.csv
          fi

          test -f annonces_vues.json || printf '[]\n'

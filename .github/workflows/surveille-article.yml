name: Surveiller un article precis

"on":
  workflow_dispatch:
    inputs:
      article:
        description: 'Article exact a surveiller (ex: iPhone 11)'
        required: true
        type: string
      max_price:
        description: 'Cout total maximum en euros, port compris (vide = affaires sous 85% du prix median)'
        required: false
        type: string
      alias:
        description: 'Autres noms possibles, separes par | (ex: switch oled|nintendo switch oled)'
        required: false
        type: string
      duree_minutes:
        description: 'Duree de ce run en minutes (max 340)'
        required: false
        default: "330"
        type: string
      relances:
        description: 'Nombre de relances automatiques apres ce run (0 = une seule fois)'
        required: false
        default: "2"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: surveille-${{ inputs.article }}
  cancel-in-progress: false

jobs:
  surveille:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Calculer le nom de l'etat
        id: slug
        env:
          ARTICLE: ${{ inputs.article }}
        run: |
          echo "value=$(python -c "import os; from watch_finder import slug; print(slug(os.environ['ARTICLE']))")" >> "$GITHUB_OUTPUT"

      - name: Restaurer la memoire (annonces deja vues)
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.slug.outputs.value }}
        run: |
          mkdir -p runtime_data
          artifact_id="$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=finder-state-${SLUG}&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o /tmp/state.zip
            unzip -oq /tmp/state.zip -d runtime_data
            echo "Memoire restauree."
          else
            echo "Aucune memoire precedente : etat des lieux au depart."
          fi

      - name: Surveiller
        id: run
        env:
          ARTICLE: ${{ inputs.article }}
          MAX_PRICE: ${{ inputs.max_price }}
          ALIAS: ${{ inputs.alias }}
          DUREE: ${{ inputs.duree_minutes }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONIOENCODING: utf-8
        run: |
          duree="${DUREE:-330}"
          if [ "$duree" -gt 340 ]; then duree=340; fi
          args=(--duration-minutes "$duree" --state-dir runtime_data)
          if [ -n "$MAX_PRICE" ]; then args+=(--max-price "$MAX_PRICE"); fi
          IFS='|' read -ra ALIASES <<< "$ALIAS"
          for a in "${ALIASES[@]}"; do
            if [ -n "$a" ]; then args+=(--alias "$a"); fi
          done
          set +e
          python -u watch_finder.py "$ARTICLE" "${args[@]}" 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sauvegarder la memoire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finder-state-${{ steps.slug.outputs.value }}
          path: runtime_data/
          retention-days: 7
          if-no-files-found: ignore

      - name: Resume
        if: always()
        env:
          ARTICLE: ${{ inputs.article }}
        run: |
          {
            echo "## Surveillance : $ARTICLE"
            echo "Code de sortie : ${{ steps.run.outputs.code }} (0 = termine normalement, 2 = Vinted bloque ce serveur)"
            echo
            if ls runtime_data/trouvailles_*.jsonl >/dev/null 2>&1; then
              echo "### Trouvailles"
              echo '```'
              cat runtime_data/trouvailles_*.jsonl | python -c "
          import sys, json
          for line in sys.stdin:
              r = json.loads(line)
              print(r['cost'], r['verdict'], r['title'], r['url'])
          "
              echo '```'
            else
              echo "Aucune trouvaille dans ce run."
            fi
            echo
            echo "### Fin du journal"
            echo '```'
            tail -n 40 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Relancer automatiquement
        if: steps.run.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTICLE: ${{ inputs.article }}
          MAX_PRICE: ${{ inputs.max_price }}
          ALIAS: ${{ inputs.alias }}
          DUREE: ${{ inputs.duree_minutes }}
          RELANCES: ${{ inputs.relances }}
        run: |
          restant="${RELANCES:-0}"
          if [ "$restant" -gt 0 ]; then
            gh workflow run surveille-article.yml \
              -f article="$ARTICLE" -f max_price="$MAX_PRICE" -f alias="$ALIAS" \
              -f duree_minutes="${DUREE:-330}" -f relances="$((restant - 1))"
            echo "Relance programmee (reste $((restant - 1)) apres celle-ci)."
          else
            echo "Dernier run de la serie."
          fi

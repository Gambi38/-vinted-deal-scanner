name: Scanner Vinted

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: scanner-vinted
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dependances.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r dependances.txt
          python -m playwright install --with-deps chromium

      - name: Préparer les noms français
        run: |
          if [ ! -f annonces_vues.json ] && [ -f seen.json ]; then cp seen.json annonces_vues.json; fi
          if [ ! -f alertes.csv ] && [ -f alerts.csv ]; then cp alerts.csv alertes.csv; fi
          test -f annonces_vues.json || printf '[]\n' > annonces_vues.json
          if [ ! -f alertes.csv ]; then
            printf 'timestamp,category,search,brand,model,size,opportunity_score,title,listing_price,total_buy_est,resale_low,resale_high,margin_low,margin_high,roi_low,reason,url,item_id\n' > alertes.csv
          fi

      - name: Vérifier le scanner
        run: |
          python -m py_compile scanner_vinted.py fusion_donnees.py
          python -m json.tool configuration.json > /dev/null
          python -m json.tool liste_noire.json > /dev/null
          python -m json.tool filtres.json > /dev/null

      - name: Tester les notifications
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -fsS \
            -H "Title: Scanner Vinted" \
            -H "Priority: high" \
            -d "Scanner Vinted demarre correctement." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Scanner Vinted
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: "https://ntfy.sh"
          HEADLESS: "1"
        run: |
          python -u scanner_vinted.py --once --headless

      - name: Sauvegarder les résultats
        if: always()
        run: |
          git config user.name "scanner-vinted-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test -f annonces_vues.json || printf '[]\n' > annonces_vues.json
          if [ ! -f alertes.csv ]; then
            printf 'timestamp,category,search,brand,model,size,opportunity_score,title,listing_price,total_buy_est,resale_low,resale_high,margin_low,margin_high,roi_low,reason,url,item_id\n' > alertes.csv
          fi

          cp annonces_vues.json /tmp/annonces-vues-local.json
          cp alertes.csv /tmp/alertes-local.csv

          saved=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            test -f annonces_vues.json || printf '[]\n' > annonces_vues.json
            if [ ! -f alertes.csv ]; then
              printf 'timestamp,category,search,brand,model,size,opportunity_score,title,listing_price,total_buy_est,resale_low,resale_high,margin_low,margin_high,roi_low,reason,url,item_id\n' > alertes.csv
            fi

            python fusion_donnees.py \
              /tmp/annonces-vues-local.json \
              /tmp/alertes-local.csv \
              annonces_vues.json \
              alertes.csv

            git add annonces_vues.json alertes.csv

            if git diff --cached --quiet; then
              saved=1
              break
            fi

            git commit -m "Mise a jour du scanner [skip ci]"

            if git push origin HEAD:main; then
              saved=1
              break
            fi

            sleep 2
          done

          test "$saved" = "1"

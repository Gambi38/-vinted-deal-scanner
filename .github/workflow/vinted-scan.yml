name: Vinted Tarayici

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: vinted-tarayici
  cancel-in-progress: true

jobs:
  # ===================== JOB 1 : BOT CLASSIQUE (Playwright) =====================
  scanner-classic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conditions.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r conditions.txt
          python -m playwright install --with-deps chromium

      - name: Restaurer l'état du dernier scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime_data

          artifact_id="$(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty'
          )"

          if [ -n "$artifact_id" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o /tmp/vinted-state.zip
            unzip -oq /tmp/vinted-state.zip -d runtime_data
          fi

          if [ ! -f runtime_data/annonces_vues.json ]; then
            if [ -f annonces_vues.json ]; then
              cp annonces_vues.json runtime_data/annonces_vues.json
            elif [ -f seen.json ]; then
              cp seen.json runtime_data/annonces_vues.json
            fi
          fi

          if [ ! -f runtime_data/alertes.csv ]; then
            if [ -f alertes.csv ]; then
              cp alertes.csv runtime_data/alertes.csv
            elif [ -f alerts.csv ]; then
              cp alerts.csv runtime_data/alertes.csv
            fi
          fi

          test -f runtime_data/annonces_vues.json || printf '[]\n' > runtime_data/annonces_vues.json
          test -f runtime_data/annonces_prix.json || printf '{}\n' > runtime_data/annonces_prix.json

          if [ ! -f runtime_data/alertes.csv ]; then
            printf 'timestamp,category,search,brand,model,size,opportunity_score,title,published_at,age_minutes,favourite_count,seller_type,previous_price,price_drop_pct,image_url,listing_price,total_buy_est,resale_low,resale_high,margin_low,margin_high,roi_low,demand_score,risk,reason,url,item_id\n' > runtime_data/alertes.csv
          fi

      - name: Vérifier les fichiers
        run: |
          python -m py_compile vinted_tarayici.py fusion_donnees.py
          if [ -f test_bot.py ]; then
            python -m unittest -v test_bot.py
          fi
          python -m json.tool config.json > /dev/null
          python -m json.tool blacklist.json > /dev/null
          python -m json.tool filtres.json > /dev/null
          test -f exemples.txt
          test -f .env.example
          test -f .gitignore

      - name: Tester les notifications (optionnel)
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -fsS \
            -H "Title: Vinted Tarayici (classique)" \
            -H "Priority: high" \
            -d "Scanner classique démarre correctement." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Lancer le scan classique (Playwright)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: "https://ntfy.sh"
          VINTED_DATA_DIR: "runtime_data"
          VINTED_LOG_LEVEL: "INFO"
          VINTED_FRESHNESS_HEALTHCHECK_MIN_SAMPLES: "3"
          VINTED_UNKNOWN_AGE_MAX_ATTEMPTS: "2"
          VINTED_SEEN_RETENTION_DAYS: "30"
          VINTED_EXCLUDE_PRO_SELLERS: "true"
          VINTED_PRICE_DROP_ALERT_PCT: "20"
          VINTED_REQUEST_DELAY_MIN_SECONDS: "1.0"
          VINTED_REQUEST_DELAY_MAX_SECONDS: "3.0"
          VINTED_BACKOFF_MAX_SECONDS: "60"
          VINTED_STARTUP_JITTER_MAX_SECONDS: "20"
          VINTED_RUN_BUDGET_SECONDS: "420"
          HEADLESS: "1"
        run: |
          python -u vinted_tarayici.py --once --headless

      - name: Sauvegarder l'état du scan classique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinted-state-classic
          path: runtime_data/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Nettoyer les anciens états (classique)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifact_ids < <(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=vinted-state&per_page=100" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[3:] | .[].id'
          )

          for artifact_id in "${artifact_ids[@]}"; do
            [ -n "$artifact_id" ] || continue
            gh api \
              --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

  # ===================== JOB 2 : NOUVEAU SCAN API-ONLY (test) =====================
  scanner-api-light:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: scanner-classic   # Attend que le classique ait terminé pour récupérer son état
    if: always()            # Lance même si le classique échoue (pour test)
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conditions.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r conditions.txt

      - name: Restaurer l'état du scan classique
        uses: actions/download-artifact@v4
        with:
          name: vinted-state-classic
          path: runtime_data/

      - name: Lancer le scan API-light (aiohttp)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: "https://ntfy.sh"
          VINTED_DATA_DIR: "runtime_data"
          VINTED_LOG_LEVEL: "INFO"
          VINTED_REJECT_UNKNOWN_LISTING_AGE: "true"
          VINTED_EXCLUDE_PRO_SELLERS: "true"
          VINTED_REQUEST_DELAY_MIN_SECONDS: "1.0"
          VINTED_REQUEST_DELAY_MAX_SECONDS: "3.0"
          VINTED_BACKOFF_MAX_SECONDS: "60"
          VINTED_STARTUP_JITTER_MAX_SECONDS: "10"
        run: |
          python -u vinted_api_light.py

      - name: Sauvegarder l'état du scan API-light (pour comparaison)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinted-state-api-light
          path: runtime_data/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
